<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">LatentGuard-VLA 78-second demo</title>
  <description id="description">A five-stage path from exact replay through verifier learning, one-shot success, closed-loop failure, and conservative redesign.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#101d36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <circle cx="1140" cy="94" r="220" fill="#1d4ed8" opacity="0.08"/>
  <circle cx="111" cy="664" r="290" fill="#0d9488" opacity="0.08"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="78" y="76" fill="#2dd4bf" font-size="18" font-weight="700" letter-spacing="3">LATENTGUARD-VLA · 78 SECOND DEMO</text>
    <text x="78" y="140" fill="#f1f5f9" font-size="48" font-weight="750">Exact evidence. Honest deployment stress test.</text>
    <text x="78" y="181" fill="#94a3b8" font-size="22">ManiSkill PickCube · positive, negative, and partial results in one audited release</text>

    <g transform="translate(78 250)" filter="url(#shadow)">
      <rect width="210" height="218" rx="24" fill="#121d34" stroke="#60a5fa" stroke-width="2"/>
      <text x="24" y="42" fill="#60a5fa" font-size="15" font-weight="700">01 · EXACT REPLAY</text>
      <text x="24" y="100" fill="#f1f5f9" font-size="36" font-weight="750">2,880</text>
      <text x="24" y="134" fill="#cbd5e1" font-size="18">strong outcomes</text>
      <text x="24" y="183" fill="#94a3b8" font-size="14">same physical state</text>
    </g>
    <path d="M300 359h40" stroke="#64748b" stroke-width="4"/><path d="m340 359-12-8v16z" fill="#64748b"/>

    <g transform="translate(350 250)" filter="url(#shadow)">
      <rect width="210" height="218" rx="24" fill="#121d34" stroke="#2dd4bf" stroke-width="2"/>
      <text x="24" y="42" fill="#2dd4bf" font-size="15" font-weight="700">02 · VERIFIER</text>
      <text x="24" y="100" fill="#f1f5f9" font-size="36" font-weight="750">0.8986</text>
      <text x="24" y="134" fill="#cbd5e1" font-size="18">test failure AUPRC</text>
      <text x="24" y="183" fill="#94a3b8" font-size="14">validation selected</text>
    </g>
    <path d="M572 359h40" stroke="#64748b" stroke-width="4"/><path d="m612 359-12-8v16z" fill="#64748b"/>

    <g transform="translate(622 250)" filter="url(#shadow)">
      <rect width="210" height="218" rx="24" fill="#121d34" stroke="#4ade80" stroke-width="2"/>
      <text x="24" y="42" fill="#4ade80" font-size="15" font-weight="700">03 · ONE-SHOT</text>
      <text x="24" y="100" fill="#f1f5f9" font-size="36" font-weight="750">98.33%</text>
      <text x="24" y="134" fill="#cbd5e1" font-size="18">vs 88.89% random</text>
      <text x="24" y="183" fill="#94a3b8" font-size="14">blind selection</text>
    </g>
    <path d="M844 359h40" stroke="#64748b" stroke-width="4"/><path d="m884 359-12-8v16z" fill="#64748b"/>

    <g transform="translate(894 250)" filter="url(#shadow)">
      <rect width="210" height="218" rx="24" fill="#121d34" stroke="#f87171" stroke-width="2"/>
      <text x="24" y="42" fill="#f87171" font-size="15" font-weight="700">04 · CLOSED LOOP</text>
      <text x="24" y="100" fill="#f1f5f9" font-size="36" font-weight="750">73.33%</text>
      <text x="24" y="134" fill="#cbd5e1" font-size="18">vs 100% primary</text>
      <text x="24" y="183" fill="#94a3b8" font-size="14">failure preserved</text>
    </g>

    <g transform="translate(78 515)" filter="url(#shadow)">
      <rect width="1026" height="116" rx="24" fill="#121d34" stroke="#fbbf24" stroke-width="2"/>
      <text x="30" y="38" fill="#fbbf24" font-size="15" font-weight="700">05 · CONSERVATIVE REDESIGN</text>
      <text x="30" y="81" fill="#f1f5f9" font-size="27" font-weight="700">100% clean success · 0% clean intervention · 4.03% fault override recall</text>
    </g>

    <g transform="translate(1144 306)">
      <circle cx="0" cy="0" r="58" fill="#2563eb"/>
      <path d="M-13-25 31 0-13 25z" fill="#fff"/>
      <text x="0" y="88" fill="#cbd5e1" font-size="16" text-anchor="middle">PLAY</text>
    </g>
    <text x="1202" y="676" fill="#64748b" font-size="14" text-anchor="end">Audited metrics · no simulated footage</text>
  </g>
</svg>
